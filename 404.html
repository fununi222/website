<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページを移動しています | FunUni-lab</title>
  <script>
    (function () {
      const path = window.location.pathname;
      const base = path.startsWith('/website/') ? '/website/' : '/';
      const relative = path.slice(base.length).replace(/^html\//, '');
      const target = base + relative;
      const home = base + 'index.html';

      if (!/^[A-Za-z0-9_./-]+\.html$/i.test(relative) || relative.includes('..')) {
        window.location.replace(home);
        return;
      }

      function redirectIfPresent(candidate) {
        fetch(candidate, { method: 'HEAD' })
          .then(function (response) {
            window.location.replace(response.ok ? candidate + window.location.search + window.location.hash : home);
          })
          .catch(function () { window.location.replace(home); });
      }

      fetch(target, { method: 'HEAD' })
        .then(function (response) {
          if (response.ok) {
            window.location.replace(target + window.location.search + window.location.hash);
            return;
          }
          const normalized = relative
            .replace(/^it\//, 'infra/')
            .replace(/^points\//, 'finance/')
            .replace(/(^|\/)\d{4}-\d{2}-\d{2}-/, '$1');
          redirectIfPresent(base + normalized);
        })
        .catch(function () { window.location.replace(home); });
    }());
  </script>
</head>
<body>
  <p>ページを直接 HTML ページへ移動しています。<a href="index.html">トップへ戻る</a></p>
</body>
</html>
