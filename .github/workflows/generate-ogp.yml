name: Auto Generate OGP Proxies and Article Index

on:
  push:
    branches:
      - main
    paths:
      - 'md/**'
      - 'SKILL.md'
      - 'scripts/generate_ogp_proxies.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate OGP proxy files and article index
        run: |
          python scripts/generate_ogp_proxies.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add html/ assets/data/article_index.json assets/js/skill-data.js assets/js/article-data.js
          
          # Check if there are staged changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-regenerate OGP proxies and article index [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
