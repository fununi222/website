<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>記事を移動しています | FunUni-lab</title>
  <script>
    (function () {
      const source = new URLSearchParams(window.location.search).get('md');
      const base = window.location.pathname.replace(/\/article\.html$/, '/');
      const fallback = base + 'index.html';
      if (!source) {
        window.location.replace(fallback);
        return;
      }

      const target = source.replace(/^\/+/, '').replace(/^md\//, '').replace(/\.md$/i, '.html');
      if (!/^[A-Za-z0-9_./-]+\.html$/i.test(target) || target.includes('..')) {
        window.location.replace(fallback);
        return;
      }
      window.location.replace(base + target + window.location.hash);
    }());
  </script>
</head>
<body>
  <p>記事を直接 HTML ページへ移動しています。<a href="index.html">トップへ戻る</a></p>
</body>
</html>
